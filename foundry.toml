[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
# Auto-detection can resolve ds-test/ to lib/solmate's older copy, which lacks assertNotEq.
auto_detect_remappings = false
remappings = [
    "ds-test/=lib/forge-std/lib/ds-test/src/",
    "forge-std/=lib/forge-std/src/",
    "lido-lend/=lib/lido-lend/",
    "solmate/=lib/solmate/src/",
]
names = true
sizes = true
via_ir = false
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
solc = "0.8.36"
evm_version = "paris"

[fuzz]
runs = 4096

[invariant]
runs = 1024
depth = 32
fail_on_revert = true

[fmt]
wrap_comments = true
line_length = 120
single_line_statement_blocks = "single"

[lint]
exclude_lints = [
    "unsafe-typecast",
    "mixed-case-function",
    "unaliased-plain-import",
    "asm-keccak256",
    "unwrapped-modifier-logic",
]
ignore = [
    'test/**/*.sol',
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
